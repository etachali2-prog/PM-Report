
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inspection Schedule Records</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #eef2f6;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 12px #0002;
}

h1 {
    text-align: center;
    color: #172554;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

input[type="search"] {
    flex: 1;
    min-width: 200px;
    padding: 11px;
    border: 1px solid #bbb;
    border-radius: 5px;
}

button {
    padding: 11px 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    background: #155eef;
}

button:hover {
    opacity: 0.85;
}

.print-btn {
    background: #15803d;
}

.status {
    margin: 12px 0;
    color: #555;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    border: 1px solid #ccc;
    padding: 12px;
    text-align: left;
    overflow-wrap: anywhere;
}

th {
    background: #172554;
    color: white;
}

tbody tr:nth-child(even) {
    background: #f1f5f9;
}

tbody tr:hover {
    background: #dbeafe;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #666;
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    .container {
        box-shadow: none;
        padding: 0;
    }

    .toolbar {
        display: none;
    }

    table {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Inspection Schedule Records</h1>

    <p>
        View inspection records submitted through the
        Block-D, Block-C and Others form.
    </p>

    <div class="toolbar">
        <input
            type="search"
            id="searchInput"
            placeholder="Search inspection records..."
            oninput="filterTable()"
        >

        <button onclick="loadData()">Refresh Data</button>

        <button class="print-btn" onclick="window.print()">
            Print / Save PDF
        </button>
    </div>

    <div class="status" id="status">
        Ready to load records.
    </div>

    <div class="table-wrap">
        <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz3S6wFeWV-CBQZUr_ip5WtYhfUlEnGLMQpfOjiT29Sb9zu1bMVOCPFaiG6-T0g6TxfpA/exec";

let allRows = [];

async function loadData() {
    const status = document.getElementById("status");
    status.textContent = "Loading records...";

    try {
        const response = await fetch(SCRIPT_URL);

        if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
        }

        const data = await response.json();

        if (data.error) {
            throw new Error(data.error);
        }

        if (!Array.isArray(data) || data.length === 0) {
            allRows = [];
            document.getElementById("tableHead").innerHTML = "";
            document.getElementById("tableBody").innerHTML =
                '<tr><td class="empty">No records found.</td></tr>';

            status.textContent = "No records found.";
            return;
        }

        allRows = data;
        renderTable(allRows);

        status.textContent =
            "Loaded " + Math.max(0, allRows.length - 1) +
            " record row(s).";

    } catch (error) {
        console.error(error);

        status.textContent =
            "Could not load data. Check the Apps Script deployment, " +
            "sheet name and browser console.";
    }
}

function renderTable(rows) {
    const head = document.getElementById("tableHead");
    const body = document.getElementById("tableBody");

    head.innerHTML = "";
    body.innerHTML = "";

    if (!rows.length) {
        body.innerHTML =
            '<tr><td class="empty">No matching records found.</td></tr>';
        return;
    }

    // The first spreadsheet row contains column headings.
    const headerRow = document.createElement("tr");

    rows[0].forEach(value => {
        const th = document.createElement("th");
        th.textContent = value;
        headerRow.appendChild(th);
    });

    head.appendChild(headerRow);

    // Display the remaining rows.
    rows.slice(1).forEach(row => {
        const tr = document.createElement("tr");

        row.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
        });

        body.appendChild(tr);
    });

    if (rows.length === 1) {
        body.innerHTML =
            '<tr><td class="empty" colspan="' +
            Math.max(rows[0].length, 1) +
            '">No records saved yet.</td></tr>';
    }
}

function filterTable() {
    const query = document
        .getElementById("searchInput")
        .value.toLowerCase()
        .trim();

    if (!allRows.length) return;

    const headers = allRows[0];

    const matchingRows = allRows.slice(1).filter(row =>
        row.some(value =>
            String(value).toLowerCase().includes(query)
        )
    );

    renderTable([headers, ...matchingRows]);

    document.getElementById("status").textContent =
        matchingRows.length + " matching record row(s).";
}

// Load records when the page opens.
loadData();
</script>

</body>
</html>
