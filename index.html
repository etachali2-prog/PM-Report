
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspection Schedule Display</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #eef2f6;
}

h2 {
    text-align: center;
    color: #172554;
}

.cont {
    background: rgb(12, 11, 18);
    min-height: 260px;
    width: 100%;
    max-width: 603px;
    margin: auto;
    text-align: center;
    color: goldenrod;
    padding: 15px 5px;
    border-radius: 8px;
}

.blocks {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 2px;
    margin-top: 15px;
}

.block {
    min-width: 0;
    min-height: 190px;
    padding: 8px 4px;
    border: 1px solid #aaa;
    background: aliceblue;
    color: #222;
}

.block:first-child {
    background: white;
}

.block input {
    display: block;
    width: 100%;
    min-width: 0;
    margin-top: 12px;
    padding: 7px 3px;
    border: 1px solid #bbb;
    border-radius: 3px;
    background: white;
    color: #222;
    font-size: 13px;
}

button {
    margin: 15px 4px;
    padding: 10px 18px;
    background: #087f8c;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

#status {
    text-align: center;
    color: #333;
    overflow-wrap: anywhere;
}

@media(max-width:450px) {
    body {
        padding: 8px;
    }

    .block {
        padding: 5px 2px;
    }

    .block input {
        font-size: 11px;
        padding: 6px 2px;
    }
}

@media print {
    button {
        display: none;
    }

    body {
        background: white;
    }
}
</style>
</head>

<body>

<h2>Inspection Schedule</h2>

<div class="cont">
    Inspection Schedule

    <div class="blocks">

        <div class="block">
            <u>Block-D</u>
            <input id="d1" placeholder="D1" readonly>
            <input id="d2" placeholder="D2" readonly>
            <input id="d3" placeholder="D3" readonly>
            <input id="d4" placeholder="D4" readonly>
        </div>

        <div class="block">
            <u>Block-C</u>
            <input id="c1" placeholder="C1" readonly>
            <input id="c2" placeholder="C2" readonly>
            <input id="c3" placeholder="C3" readonly>
            <input id="c4" placeholder="C4" readonly>
        </div>

        <div class="block">
            <u>Others</u>
            <input id="o1" placeholder="O1" readonly>
            <input id="o2" placeholder="O2" readonly>
            <input id="o3" placeholder="O3" readonly>
            <input id="o4" placeholder="O4" readonly>
        </div>

    </div>
</div>

<div style="text-align:center">
    <button onclick="loadData()">Refresh Data</button>
    <button onclick="window.print()">Print</button>
</div>

<p id="status">Loading saved inspection data...</p>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwLl3rBFb8vaEznvF-QoT6FeNDshE6e-8FOGOcQa6nlq9d82AOlDf5UtXDmU1_QJ3NDZA/exec";

const fields = [
    "d1", "d2", "d3", "d4",
    "c1", "c2", "c3", "c4",
    "o1", "o2", "o3", "o4"
];

async function loadData() {
    const status = document.getElementById("status");
    status.textContent = "Loading data...";

    try {
        const response = await fetch(SCRIPT_URL);

        if (!response.ok) {
            throw new Error("HTTP error " + response.status);
        }

        const result = await response.json();

        // Format 1: Apps Script returns {success:true, data:{d1:...}}
        if (result.success === false || result.error) {
            throw new Error(result.message || result.error);
        }

        let record = result.data || result;

        // Format 2: Apps Script returns the whole sheet as a 2D array.
        if (Array.isArray(result)) {
            if (result.length < 2) {
                throw new Error("No saved records found.");
            }

            const headers = result[0].map(value =>
                String(value).trim().toLowerCase()
            );

            record = result.slice(1).reverse().find(row =>
                fields.some(field => {
                    const index = headers.indexOf(field);
                    return index >= 0 &&
                        String(row[index] ?? "").trim() !== "";
                })
            );

            if (record) {
                const mapped = {};

                fields.forEach(field => {
                    const index = headers.indexOf(field);
                    mapped[field] =
                        index >= 0 ? record[index] : "";
                });

                record = mapped;
            }
        }

        if (!record) {
            throw new Error("No saved inspection record found.");
        }

        fields.forEach(field => {
            document.getElementById(field).value =
                record[field] ?? "";
        });

        status.textContent =
            "Inspection data loaded successfully.";

    } catch (error) {
        console.error("Loading error:", error);

        status.textContent =
            "Unable to load Google Sheets data. Check your " +
            "Apps Script doGet() function, deployment, sheet name, " +
            "and browser console.";
    }
}

loadData();
</script>

</body>
</html>
