
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inspection Schedule Records</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef3f8;
    margin: 0;
    padding: 20px;
    color: #1f2937;
}

.container {
    max-width: 1400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000015;
}

h1 {
    text-align: center;
    color: #123b69;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    color: white;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.refresh {
    background: #087f5b;
}

.print {
    background: #145da0;
}

.table-container {
    overflow-x: auto;
    width: 100%;
}

table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #cbd5e1;
    padding: 12px;
    text-align: center;
    overflow-wrap: anywhere;
}

thead th {
    color: white;
    font-size: 16px;
}

thead th:first-child,
thead th:nth-child(2) {
    background: #334155;
}

.group-d {
    background: #145da0;
}

.group-c {
    background: #087f5b;
}

.group-o {
    background: #7c3aed;
}

tbody tr:nth-child(even) {
    background: #f1f5f9;
}

tbody tr:hover {
    background: #dbeafe;
}

tbody td:nth-child(3),
tbody td:nth-child(4),
tbody td:nth-child(5) {
    text-align: left;
    white-space: pre-wrap;
    min-width: 180px;
}

#status {
    margin: 12px 0;
    color: #475569;
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    .container {
        box-shadow: none;
        padding: 0;
        max-width: none;
    }

    .actions {
        display: none;
    }

    .table-container {
        overflow: visible;
    }

    table {
        min-width: 0;
        width: 100%;
        font-size: 10px;
    }

    th, td {
        padding: 6px 4px;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>Inspection Schedule</h1>
    <p class="subtitle">
       
    </p>

    <div class="actions">
        <button class="refresh" id="refreshBtn" onclick="loadData()">
            Refresh Data
        </button>

        <button class="print" onclick="window.print()">
            Print / Save PDF
        </button>
    </div>

    <p id="status">Loading Google Sheets data...</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>No.</th>
                    <th class="group-d">D-Block</th>
                    <th class="group-c">C-Block</th>
                    <th class="group-o">O-Block</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxlWajMab3wK_jDZjH2xyiR8mIPYruKgArDLC4imAJHupDN-zqsRfcJeOgosHEDwJXTNQ/exec";

let requestNumber = 0;

function loadData() {
    const status = document.getElementById("status");
    const tbody = document.getElementById("tableBody");
    const refreshBtn = document.getElementById("refreshBtn");

    const thisRequest = ++requestNumber;
    const callbackName = "inspectionCallback_" + Date.now()
        + "_" + thisRequest;

    const script = document.createElement("script");

    let finished = false;

    status.textContent = "Loading Google Sheets data...";
    refreshBtn.disabled = true;
    tbody.replaceChildren();

    function cleanup() {
        if (finished) return;
        finished = true;

        clearTimeout(timeout);
        script.remove();

        try {
            delete window[callbackName];
        } catch (error) {
            window[callbackName] = undefined;
        }

        if (thisRequest === requestNumber) {
            refreshBtn.disabled = false;
        }
    }

    const timeout = setTimeout(() => {
        cleanup();

        if (thisRequest === requestNumber) {
            status.textContent =
                "Loading timed out. Check the Apps Script URL and deployment access.";
        }
    }, 20000);

    window[callbackName] = function(data) {
        if (finished) return;

        cleanup();

        if (thisRequest !== requestNumber) return;

        if (!Array.isArray(data)) {
            status.textContent =
                data && data.error
                    ? data.error
                    : "Unexpected data format.";
            return;
        }

        // Skip the header row in Google Sheets.
        const rows = data.slice(1);

        // Remove completely empty rows.
        const records = rows.filter(row =>
            row.some(value => String(value).trim() !== "")
        );

        if (records.length === 0) {
            status.textContent = "No saved records found.";
            return;
        }

        records.forEach((row, index) => {
            const tr = document.createElement("tr");

            // Column A: Date
            const dateCell = document.createElement("td");
            dateCell.textContent = row[0] ?? "";
            tr.appendChild(dateCell);

            // Record number
            const numberCell = document.createElement("td");
            numberCell.textContent = index + 1;
            tr.appendChild(numberCell);

            // Columns B–E: D-Block
            const dCell = document.createElement("td");
            dCell.textContent = row.slice(1, 5)
                .filter(value => String(value).trim() !== "")
                .join(" | ") || "—";
            tr.appendChild(dCell);

            // Columns F–I: C-Block
            const cCell = document.createElement("td");
            cCell.textContent = row.slice(5, 9)
                .filter(value => String(value).trim() !== "")
                .join(" | ") || "—";
            tr.appendChild(cCell);

            // Columns J–M: O-Block
            const oCell = document.createElement("td");
            oCell.textContent = row.slice(9, 13)
                .filter(value => String(value).trim() !== "")
                .join(" | ") || "—";
            tr.appendChild(oCell);

            tbody.appendChild(tr);
        });

        status.textContent =
            "Successfully displayed " + records.length + " record(s).";
    };

    script.onerror = function() {
        cleanup();

        if (thisRequest === requestNumber) {
            status.textContent =
                "Could not connect. Check your Apps Script URL and deployment.";
        }
    };

    script.src = SCRIPT_URL
        + "?callback=" + encodeURIComponent(callbackName)
        + "&t=" + Date.now();

    document.body.appendChild(script);
}

loadData();
</script>

</body>
</html>
