
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inspection Schedule</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #eef2f6;
    color: #222;
}

h2 {
    text-align: center;
    color: #172554;
}

.cont {
    background: #0c0b12;
    width: 100%;
    max-width: 650px;
    margin: auto;
    text-align: center;
    color: goldenrod;
    padding: 15px 8px;
    border-radius: 8px;
}

.blocks {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px;
    margin-top: 15px;
}

.block {
    min-width: 0;
    min-height: 200px;
    padding: 8px 4px;
    border: 1px solid #aaa;
    background: aliceblue;
    color: #222;
}

.block:first-child {
    background: white;
}

.block input {
    display: block;
    width: 100%;
    min-width: 0;
    margin-top: 12px;
    padding: 8px 3px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: white;
    color: #222;
    font-size: 13px;
}

.block input:disabled {
    opacity: 1;
    -webkit-text-fill-color: #222;
}

.entry {
    max-width: 650px;
    margin: 22px auto;
    padding: 18px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px #0001;
}

.entry h3 {
    margin-top: 0;
    color: #172554;
}

.entry label {
    display: block;
    margin-top: 12px;
    font-size: 14px;
    font-weight: bold;
}

.entry input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #bbb;
    border-radius: 4px;
}

.actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 18px auto;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 5px;
    color: white;
    background: #087f8c;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.submit-btn {
    background: #155eef;
}

.print-btn {
    background: #15803d;
}

#status {
    text-align: center;
    margin: 15px auto;
    overflow-wrap: anywhere;
}

@media (max-width: 450px) {
    body {
        padding: 8px;
    }

    .block {
        padding: 6px 2px;
        font-size: 12px;
    }

    .block input {
        font-size: 11px;
        padding: 6px 2px;
    }
}

@media print {
    .entry, .actions, #status {
        display: none;
    }

    body {
        background: white;
        padding: 0;
    }
}
</style>
</head>

<body>

<h2>Inspection Schedule</h2>

<!-- DISPLAY DATA FROM GOOGLE SHEETS -->
<div class="cont">
    Inspection Schedule

    <div class="blocks">

        <div class="block">
            <u>Block-D</u>
            <input id="d1" placeholder="D1" disabled>
            <input id="d2" placeholder="D2" disabled>
            <input id="d3" placeholder="D3" disabled>
            <input id="d4" placeholder="D4" disabled>
        </div>

        <div class="block">
            <u>Block-C</u>
            <input id="c1" placeholder="C1" disabled>
            <input id="c2" placeholder="C2" disabled>
            <input id="c3" placeholder="C3" disabled>
            <input id="c4" placeholder="C4" disabled>
        </div>

        <div class="block">
            <u>Others</u>
            <input id="o1" placeholder="O1" disabled>
            <input id="o2" placeholder="O2" disabled>
            <input id="o3" placeholder="O3" disabled>
            <input id="o4" placeholder="O4" disabled>
        </div>

    </div>
</div>

<div class="actions">
    <button type="button" onclick="loadInspection()">
        Refresh Data
    </button>

    <button type="button" class="print-btn"
            onclick="window.print()">
        Print / Save PDF
    </button>
</div>

<p id="status">Connecting to Google Sheets...</p>

<!-- FORM TO SAVE NEW INSPECTION DATA -->
<div class="entry">
    <h3>Enter Inspection Schedule</h3>

    <form id="inspectionForm"
          action="https://script.google.com/macros/s/AKfycbxv4rAp_E6bEUGhwGYzn-7bRuP6wMpJTnUBavJTxudMNasTSpqjqh4-EfUejcCEydPHhg/exec"
          method="POST"
          target="submitFrame">

        <h4>Block-D</h4>

        <label for="form_d1">D1</label>
        <input id="form_d1" name="d1">

        <label for="form_d2">D2</label>
        <input id="form_d2" name="d2">

        <label for="form_d3">D3</label>
        <input id="form_d3" name="d3">

        <label for="form_d4">D4</label>
        <input id="form_d4" name="d4">

        <h4>Block-C</h4>

        <label for="form_c1">C1</label>
        <input id="form_c1" name="c1">

        <label for="form_c2">C2</label>
        <input id="form_c2" name="c2">

        <label for="form_c3">C3</label>
        <input id="form_c3" name="c3">

        <label for="form_c4">C4</label>
        <input id="form_c4" name="c4">

        <h4>Others</h4>

        <label for="form_o1">O1</label>
        <input id="form_o1" name="o1">

        <label for="form_o2">O2</label>
        <input id="form_o2" name="o2">

        <label for="form_o3">O3</label>
        <input id="form_o3" name="o3">

        <label for="form_o4">O4</label>
        <input id="form_o4" name="o4">

        <div class="actions">
            <button class="submit-btn" type="submit" id="submitBtn">
                Save Inspection
            </button>
        </div>
    </form>
</div>

<!-- Hidden frame lets the form submit without leaving this page -->
<iframe name="submitFrame" id="submitFrame"
        title="Form submission"
        style="display:none"></iframe>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxv4rAp_E6bEUGhwGYzn-7bRuP6wMpJTnUBavJTxudMNasTSpqjqh4-EfUejcCEydPHhg/exec";

const fields = [
    "d1", "d2", "d3", "d4",
    "c1", "c2", "c3", "c4",
    "o1", "o2", "o3", "o4"
];

// Read the latest saved record from Google Sheets.
async function loadInspection() {
    const status = document.getElementById("status");
    status.textContent = "Loading Google Sheets data...";

    try {
        const response = await fetch(SCRIPT_URL);

        if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
        }

        const result = await response.json();

        if (result.success === false || result.error) {
            throw new Error(result.message || result.error);
        }

        // Supports the object returned by the supplied Code.gs.
        const data = result.data;

        if (!data) {
            fields.forEach(field => {
                document.getElementById(field).value = "";
            });

            status.textContent = "No inspection record saved yet.";
            return;
        }

        fields.forEach(field => {
            document.getElementById(field).value =
                data[field] ?? "";
        });

        status.textContent =
            "Latest inspection record loaded successfully.";

    } catch (error) {
        console.error("Loading error:", error);

        status.textContent =
            "Unable to load data. Check the script deployment, " +
            "sheet name and browser console.";
    }
}

// Submit the form without navigating away from this page.
const form = document.getElementById("inspectionForm");
const submitBtn = document.getElementById("submitBtn");
const submitFrame = document.getElementById("submitFrame");

let submitting = false;

form.addEventListener("submit", function(event) {
    if (submitting) {
        event.preventDefault();
        return;
    }

    submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";
    document.getElementById("status").textContent =
        "Submitting inspection data...";

    // The form is submitted to the hidden iframe.
    // Refresh after a short delay to allow Sheets to update.
    setTimeout(async function() {
        await loadInspection();

        submitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Save Inspection";
    }, 2500);
});

// Load existing data when the page opens.
loadInspection();
</script>

</body>
</html>
