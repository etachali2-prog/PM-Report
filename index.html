
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inspection Schedule Records</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef3f8;
    margin: 0;
    padding: 20px;
    color: #1f2937;
}

.container {
    max-width: 1400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000015;
}

h1 {
    text-align: center;
    color: #123b69;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    color: white;
}

.refresh {
    background: #087f5b;
}

.print {
    background: #145da0;
}

.table-container {
    overflow-x: auto;
    width: 100%;
}

table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #cbd5e1;
    padding: 12px;
    text-align: center;
    min-width: 100px;
    overflow-wrap: anywhere;
}

thead tr:first-child th {
    color: white;
    font-size: 16px;
}

.group-d {
    background: #145da0;
}

.group-c {
    background: #087f5b;
}

.group-o {
    background: #7c3aed;
}

.subhead th {
    background: #e2e8f0;
    color: #1e293b;
}

tbody tr:nth-child(even) {
    background: #f1f5f9;
}

tbody tr:hover {
    background: #dbeafe;
}

#status {
    margin: 12px 0;
    color: #475569;
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    .container {
        box-shadow: none;
        padding: 0;
    }

    .actions {
        display: none;
    }

    .table-container {
        overflow: visible;
    }

    table {
        min-width: 0;
        font-size: 9px;
    }

    th, td {
        padding: 5px 3px;
        min-width: 0;
    }
}
</style>
</head>

<body>
<div class="container">

<h1>Inspection Schedule</h1>
<p class="subtitle">Google Sheets — Saved Inspection Records</p>

<div class="actions">
    <button class="refresh" onclick="loadData()">Refresh Data</button>
    <button class="print" onclick="window.print()">Print / Save PDF</button>
</div>

<p id="status">Loading data...</p>

<div class="table-container">
<table>
    <thead>
        <tr>
            <th rowspan="2">No.</th>
            <th colspan="4" class="group-d">Block-D</th>
            <th colspan="4" class="group-c">Block-C</th>
            <th colspan="4" class="group-o">Others</th>
        </tr>
        <tr class="subhead">
            <th>d1</th><th>d2</th><th>d3</th><th>d4</th>
            <th>c1</th><th>c2</th><th>c3</th><th>c4</th>
            <th>o1</th><th>o2</th><th>o3</th><th>o4</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyqiOVlQydudbI5yfuSohUlW98pYKSB6sLIqicgiSgEAPeMf9MxTb1l5gtMsFNgepmPeA/exec";

function loadData() {
    const status = document.getElementById("status");
    const tbody = document.getElementById("tableBody");

    status.textContent = "Loading Google Sheets data...";
    tbody.replaceChildren();

    // Unique callback name for this request
    const callbackName =
        "inspectionCallback_" + Date.now();

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
        cleanup();
        status.textContent =
            "Unable to load data. Check the Apps Script deployment and sheet name.";
    }, 20000);

    function cleanup() {
        clearTimeout(timeout);
        script.remove();
        try {
            delete window[callbackName];
        } catch (e) {
            window[callbackName] = undefined;
        }
    }

    window[callbackName] = function(data) {
        cleanup();

        if (!Array.isArray(data)) {
            status.textContent = "Unexpected data format.";
            return;
        }

        // Skip the first row if it contains column headings
        const rows = data.slice(1);

        if (rows.length === 0) {
            status.textContent = "No saved records found.";
            return;
        }

        rows.forEach((row, index) => {
            const tr = document.createElement("tr");

            const numberCell = document.createElement("td");
            numberCell.textContent = index + 1;
            tr.appendChild(numberCell);

            for (let col = 0; col < 12; col++) {
                const td = document.createElement("td");
                td.textContent = row[col] ?? "";
                tr.appendChild(td);
            }

            tbody.appendChild(tr);
        });

        status.textContent =
            "Successfully displayed " + rows.length + " record(s).";
    };

    script.onerror = function() {
        cleanup();
        status.textContent =
            "Could not connect. Check your Apps Script URL and deployment.";
    };

    script.src = SCRIPT_URL
        + "?callback=" + encodeURIComponent(callbackName)
        + "&t=" + Date.now();

    document.body.appendChild(script);
}

loadData();
</script>
</body>
</html>
