
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspection Schedule</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f6;
    padding: 20px;
}

.cont {
    background: rgb(12, 11, 18);
    width: 100%;
    max-width: 620px;
    min-height: 280px;
    margin: auto;
    text-align: center;
    position: relative;
    color: goldenrod;
    padding: 15px 5px;
    border-radius: 8px;
}

.blocks {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 3px;
    margin-top: 15px;
}

.block {
    min-width: 0;
    min-height: 190px;
    border: 1px solid #aaa;
    background: aliceblue;
    color: #222;
    padding: 8px 4px;
}

.block:first-child {
    background: white;
}

.block input {
    width: 100%;
    min-width: 0;
    margin-top: 12px;
    padding: 6px 2px;
    border: 1px solid #bbb;
    border-radius: 3px;
    background: #fff;
    color: #222;
}

.block input:disabled {
    opacity: 1;
    -webkit-text-fill-color: #222;
}

button {
    margin: 15px 4px;
    padding: 10px 18px;
    background: #087f8c;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

#status {
    text-align: center;
    color: #333;
    margin: 12px;
}

@media (max-width: 450px) {
    body {
        padding: 8px;
    }

    .block {
        padding: 5px 2px;
        font-size: 13px;
    }

    .block input {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<h2 style="text-align:center">Inspection Schedule</h2>

<div class="cont">
    Inspection Schedule

    <div class="blocks">

        <div class="block">
            <u>Block-D</u>
            <input id="d1" placeholder="D1" disabled>
            <input id="d2" placeholder="D2" disabled>
            <input id="d3" placeholder="D3" disabled>
            <input id="d4" placeholder="D4" disabled>
        </div>

        <div class="block">
            <u>Block-C</u>
            <input id="c1" placeholder="C1" disabled>
            <input id="c2" placeholder="C2" disabled>
            <input id="c3" placeholder="C3" disabled>
            <input id="c4" placeholder="C4" disabled>
        </div>

        <div class="block">
            <u>Others</u>
            <input id="o1" placeholder="O1" disabled>
            <input id="o2" placeholder="O2" disabled>
            <input id="o3" placeholder="O3" disabled>
            <input id="o4" placeholder="O4" disabled>
        </div>

    </div>
</div>

<div style="text-align:center">
    <button onclick="loadInspection()">Refresh Data</button>
</div>

<p id="status">Loading Google Sheets data...</p>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxv4rAp_E6bEUGhwGYzn-7bRuP6wMpJTnUBavJTxudMNasTSpqjqh4-EfUejcCEydPHhg/exec";

async function loadInspection() {
    const status = document.getElementById("status");
    status.textContent = "Loading...";

    try {
        const response = await fetch(SCRIPT_URL);

        if (!response.ok) {
            throw new Error("HTTP error " + response.status);
        }

        const data = await response.json();

        // Expected format:
        // [["d1","d2","d3","d4","c1","c2","c3","c4",
        //   "o1","o2","o3","o4"],
        //  ["value1","value2",...,"value12"]]

        if (!Array.isArray(data) || data.length < 2) {
            throw new Error("No saved records found.");
        }

        // Locate columns by their header names.
        const headers = data[0].map(
            h => String(h).trim().toLowerCase()
        );

        // Display the most recent non-empty data row.
        const record = [...data].reverse().slice(0, -1)
            .find(row => row.some(v => String(v).trim() !== ""));

        if (!record) {
            throw new Error("No inspection data found.");
        }

        const fields = [
            "d1", "d2", "d3", "d4",
            "c1", "c2", "c3", "c4",
            "o1", "o2", "o3", "o4"
        ];

        fields.forEach(field => {
            const index = headers.indexOf(field);
            document.getElementById(field).value =
                index >= 0 ? (record[index] ?? "") : "";
        });

        status.textContent = "Inspection data loaded successfully.";

    } catch (error) {
        console.error(error);
        status.textContent =
            "Could not load data. Check Apps Script doGet(), " +
            "sheet headers and web app permissions.";
    }
}

loadInspection();
</script>

</body>
</html>
